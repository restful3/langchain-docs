  <text x="180" y="252" text-anchor="middle" font-family="Arial" font-size="14" fill="white">message/stream</text>
  <rect x="640" y="160" width="240" height="120" rx="12" fill="#7c3aed"/>
  <text x="760" y="195" text-anchor="middle" font-family="Arial" font-size="22" fill="white">Callee Agent</text>
