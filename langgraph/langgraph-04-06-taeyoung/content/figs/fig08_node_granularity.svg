<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 0 564 180" font-family="'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/>
    </marker>
  </defs>

  <!-- LEFT: one big node -->
  <text x="135" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F2C59">큰 노드 하나</text>
  <rect x="24" y="40" width="222" height="86" rx="8" fill="#FEF2F2" stroke="#E11D48" stroke-width="1.6"/>
  <text x="135" y="78" text-anchor="middle" font-size="11" fill="#0F2C59">fetch + signal + size</text>
  <text x="135" y="96" text-anchor="middle" font-size="11" fill="#0F2C59">+ place_order  (한 함수)</text>
  <!-- re-run span (full) -->
  <line x1="24" y1="140" x2="246" y2="140" stroke="#E11D48" stroke-width="3"/>
  <text x="135" y="158" text-anchor="middle" font-size="10" fill="#E11D48">재실행 범위 = 전체</text>

  <!-- divider -->
  <line x1="280" y1="34" x2="280" y2="168" stroke="#E5E7EB" stroke-width="1.2"/>

  <!-- RIGHT: small nodes -->
  <text x="438" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F2C59">작은 노드 여럿</text>
  <rect x="312" y="48" width="68" height="40" rx="6" fill="#EEF2FB" stroke="#2563EB" stroke-width="1.3"/>
  <text x="346" y="72" text-anchor="middle" font-size="10" fill="#0F2C59">fetch</text>
  <rect x="404" y="48" width="68" height="40" rx="6" fill="#EEF2FB" stroke="#2563EB" stroke-width="1.3"/>
  <text x="438" y="72" text-anchor="middle" font-size="10" fill="#0F2C59">signal</text>
  <rect x="496" y="48" width="68" height="40" rx="6" fill="#FEF2F2" stroke="#E11D48" stroke-width="1.6"/>
  <text x="530" y="72" text-anchor="middle" font-size="10" fill="#0F2C59">place</text>

  <line x1="380" y1="68" x2="404" y2="68" stroke="#0F2C59" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="472" y1="68" x2="496" y2="68" stroke="#0F2C59" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- re-run span (only last) -->
  <line x1="496" y1="140" x2="564" y2="140" stroke="#E11D48" stroke-width="3"/>
  <line x1="312" y1="140" x2="472" y2="140" stroke="#059669" stroke-width="3"/>
  <text x="392" y="158" text-anchor="middle" font-size="10" fill="#059669">이전 checkpoint 보존</text>
  <text x="530" y="158" text-anchor="middle" font-size="10" fill="#E11D48">재실행</text>
</svg>
